name: Deploy

# Run only after CI succeeds on main (or manual dispatch).
# Avoids deploying in parallel with a failing typecheck.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '565393069879'
  ECR_FRONTEND: expense-tracker-frontend
  ECR_BACKEND: expense-tracker-backend
  ECS_CLUSTER: expense-tracker
  VITE_API_URL: https://api.briefly-learn.com

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::565393069879:role/GitHubActionsExpenseTracker
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHA_TAG="${SHA::12}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.backend_image }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.frontend_image }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy CDK (desiredCount=1, imageTag=latest)
        working-directory: infra
        run: |
          npx cdk deploy --all \
            --require-approval never \
            -c imageTag=latest \
            -c desiredCount=1

      - name: Force ECS redeploy
        run: |
          SERVICES=$(aws ecs list-services --cluster "$ECS_CLUSTER" --query 'serviceArns[]' --output text)
          for SERVICE_ARN in $SERVICES; do
            SERVICE_NAME="${SERVICE_ARN##*/}"
            echo "Updating ${SERVICE_NAME}..."
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$SERVICE_NAME" \
              --desired-count 1 \
              --force-new-deployment \
              --no-cli-pager >/dev/null
          done

      - name: Wait for services stable
        run: |
          SERVICES=$(aws ecs list-services --cluster "$ECS_CLUSTER" --query 'serviceArns[]' --output text)
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services $SERVICES

      - name: Smoke check
        run: |
          set -e
          curl -fsS https://api.briefly-learn.com/health
          echo
          curl -fsS -o /dev/null -w "app:%{http_code}\n" https://app.briefly-learn.com/
