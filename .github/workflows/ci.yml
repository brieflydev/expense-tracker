name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    env:
      # prisma generate loads prisma.config.ts which requires DATABASE_URL;
      # no DB connection is made during generate.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/expense_tracker?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w @expense-tracker/backend

      - name: Typecheck
        run: npm run typecheck
