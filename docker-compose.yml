# Reference compose stack for documentation / CI agents with Docker.
# This workshop VM cannot run containers locally (hypervisor limitation).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense -d expense_tracker']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://expense:expense@db:5432/expense_tracker?schema=public
      JWT_ACCESS_SECRET: compose-access-secret-change-me
      JWT_REFRESH_SECRET: compose-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:8080
      PORT: 4000
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
